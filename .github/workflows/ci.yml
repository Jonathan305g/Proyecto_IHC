name: CI

on:
  pull_request:
    branches: [develop, 'release/**', main]
  push:
    branches: [develop, 'release/**', main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: utd
          POSTGRES_PASSWORD: utd
          POSTGRES_DB: utd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utd -d utd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://utd:utd@localhost:5432/utd_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @utd/api test:e2e
      - run: pnpm build

  playwright:
    name: Pruebas E2E (Playwright)
    # Solo después de fusionar en develop, release/* o main (docs/TESTING.md §6).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @utd/shared build
      - run: pnpm --filter @utd/web exec playwright install --with-deps chromium
      - run: pnpm --filter @utd/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: utd
      POSTGRES_PASSWORD: utd
      POSTGRES_DB: utd
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utd -d utd']
      interval: 5s
      timeout: 5s
      retries: 10

  # BD de pruebas e2e: sin volumen, se recrea en cada corrida.
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: utd
      POSTGRES_PASSWORD: utd
      POSTGRES_DB: utd_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utd -d utd_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # Perfil demo: `docker compose --profile demo up --build`.
  # Datos de ejemplo: `docker compose --profile demo run --rm api pnpm --filter @utd/api db:seed`.
  api:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://utd:utd@db:5432/utd
      WEB_ORIGIN: http://localhost:8080
      API_PORT: '3000'
      AI_PROVIDER: mock
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:

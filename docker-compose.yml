services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: utd
      POSTGRES_PASSWORD: utd
      POSTGRES_DB: utd
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utd -d utd']
      interval: 5s
      timeout: 5s
      retries: 10

  # BD de pruebas e2e: sin volumen, se recrea en cada corrida.
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: utd
      POSTGRES_PASSWORD: utd
      POSTGRES_DB: utd_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utd -d utd_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
